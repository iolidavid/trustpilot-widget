<style>
  .tp-widget-root * { box-sizing: border-box; margin: 0; padding: 0; }
  .tp-hidden { display: none !important; }

  .tp-widget-root {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: transparent;
    padding: 40px 20px;
    max-width: 1200px;
    margin: 0 auto;
  }

  /* ── Header ── */
  .tp-header {
    display: flex;
    align-items: center;
    gap: 20px;
    margin-bottom: 32px;
    flex-wrap: wrap;
  }
  .tp-logo {
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
  }
  .tp-logo img { width: 30px; height: 30px; object-fit: contain; display: block; }
  .tp-logo-text { font-size: 21px; font-weight: 700; color: #09113D; }
  .tp-divider { width: 1px; height: 34px; background: #ddd; flex-shrink: 0; }
  .tp-summary { display: flex; align-items: center; gap: 10px; }
  .tp-score   { font-size: 28px; font-weight: 800; color: #09113D; }
  .tp-stars-row { display: flex; gap: 3px; }
  .tp-star-svg  { width: 26px; height: 26px; display: block; }
  .tp-count     { font-size: 14px; color: #6b6b78; font-weight: 500; }
  .tp-link {
    margin-left: auto;
    font-size: 13px;
    color: #ffffff;
    text-decoration: none;
    font-weight: 700;
    background: #0d27f4;
    padding: 8px 20px;
    border-radius: 10px;
    transition: background 0.2s, box-shadow 0.2s, transform 0.2s;
    white-space: nowrap;
  }
  .tp-link:hover,
  .tp-link:focus {
    background: #0a1fc4;
    color: #ffffff;
    box-shadow: 0 4px 14px rgba(13,39,244,0.35);
    transform: translateY(-1px);
  }

  /* Botón "Ver todas" solo para móvil (oculto en escritorio) */
  .tp-link-mobile {
    display: none;
    margin: 22px auto 0;
    width: fit-content;
    font-size: 14px;
    color: #ffffff;
    text-decoration: none;
    font-weight: 700;
    background: #0d27f4;
    padding: 11px 26px;
    border-radius: 10px;
    transition: background 0.2s, box-shadow 0.2s, transform 0.2s;
  }
  .tp-link-mobile:hover,
  .tp-link-mobile:focus {
    background: #0a1fc4;
    color: #ffffff;
    box-shadow: 0 4px 14px rgba(13,39,244,0.35);
    transform: translateY(-1px);
  }

  /* ── Skeleton ── */
  .tp-skeleton-row {
    display: flex;
    gap: 16px;
    overflow: hidden;
  }
  .tp-skeleton-card {
    flex: 0 0 calc(33.333% - 11px);
    background: #fff;
    border-radius: 12px;
    padding: 20px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.07);
  }
  .tp-skeleton-line {
    height: 12px;
    border-radius: 6px;
    background: linear-gradient(90deg, #eee 25%, #f5f5f5 50%, #eee 75%);
    background-size: 200% 100%;
    animation: tp-shimmer 1.4s infinite;
    margin-bottom: 10px;
  }
  @keyframes tp-shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

  /* ── Carrusel ── */
  .tp-carousel-wrapper {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .tp-carousel-viewport {
    overflow: hidden;
    flex: 1;
    padding: 16px 0;
    margin: -16px 0;
  }
  .tp-carousel-track {
    display: flex;
    gap: 16px;
    transition: transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    will-change: transform;
  }

  /* ── Tarjetas ── */
  .tp-card {
    background: #fff;
    border-radius: 12px;
    padding: 22px;
    box-shadow: 0 2px 16px rgba(0,0,0,0.08);
    display: flex;
    flex-direction: column;
    gap: 12px;
    flex-shrink: 0;
  }

  /* Cabecera: avatar + nombre (izq) y fecha (der) */
  .tp-card-head {
    display: flex;
    align-items: flex-start;
    gap: 10px;
  }
  .tp-avatar {
    position: relative;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: #d5d8e0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 14px;
    color: #4b4b57;
    flex-shrink: 0;
  }
  .tp-avatar-badge {
    position: absolute;
    right: -2px;
    bottom: -2px;
    width: 15px;
    height: 15px;
    border-radius: 50%;
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .tp-avatar-badge svg { width: 15px; height: 15px; display: block; }
  .tp-card-head-info { flex: 1; min-width: 0; }
  .tp-author-name {
    font-size: 14px;
    font-weight: 700;
    color: #09113D;
    line-height: 1.3;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .tp-author-meta { font-size: 12px; color: #6b6b78; margin-top: 1px; }
  .tp-card-date-top { font-size: 12px; color: #6b6b78; white-space: nowrap; flex-shrink: 0; }

  .tp-card-stars { display: flex; gap: 3px; }
  .tp-card-star  { width: 22px; height: 22px; display: block; }
  .tp-card-title {
    font-size: 17px;
    font-weight: 700;
    color: #09113D;
    line-height: 1.4;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .tp-card-text {
    font-size: 15px;
    line-height: 1.65;
    color: #4b4b57;
    flex: 1;
    display: -webkit-box;
    -webkit-line-clamp: 4;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .tp-card-foot { margin-top: 2px; }
  .tp-card-exp { font-size: 12px; color: #6b6b78; }
  .tp-card-exp b { color: #09113D; font-weight: 600; }

  /* ── Botones nav ── */
  .tp-nav {
    width: 36px;
    height: 36px;
    min-width: 36px;
    border-radius: 50%;
    background: #D7F777;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    color: #09113D;
    font-weight: 700;
    flex-shrink: 0;
    transition: background 0.2s;
    line-height: 1;
    padding: 0;
    user-select: none;
  }
  .tp-nav:hover { background: #c8ed60; }

  @media (max-width: 768px) {
    .tp-score { font-size: 22px; }
    .tp-link  { font-size: 12px; padding: 6px 14px; }
  }
  @media (max-width: 480px) {
    .tp-link { display: none; }
    .tp-link-mobile { display: block; }
    .tp-widget-root { padding: 24px 12px; }
    .tp-carousel-wrapper { gap: 4px; }
    .tp-nav {
      width: 24px;
      height: 24px;
      min-width: 24px;
      font-size: 14px;
    }
  }
</style>

<div class="tp-widget-root">

  <div class="tp-header">
    <a class="tp-logo" href="https://www.trustpilot.com/review/asuntosdigitales.com" target="_blank" rel="noopener">
      <img src="https://kajabi-storefronts-production.kajabi-cdn.com/kajabi-storefronts-production/file-uploads/sites/2147553946/images/87777f0-135d-5a6-0b1b-04b1a5f4c4_trustpilot.jpg" alt="Trustpilot">

  <!-- Skeleton (visible hasta cargar) -->
  <div id="tp-skeleton-state">
    <div class="tp-skeleton-row">

        <div class="tp-skeleton-line" style="width:60%"></div>

      <div class="tp-skeleton-card">
        <div class="tp-skeleton-line" style="width:60%"></div>
        <div class="tp-skeleton-line" style="width:100%"></div>
        <div class="tp-skeleton-line" style="width:90%"></div>
        <div class="tp-skeleton-line" style="width:40%;margin-top:16px"></div>

  <!-- Carrusel real (oculto hasta cargar) -->
  <div id="tp-loaded-state" class="tp-hidden">

      <button class="tp-nav" id="tp-prev">&#8249;</button>
      <div class="tp-carousel-viewport" id="tp-viewport">
        <div class="tp-carousel-track" id="tp-track"></div>

      <button class="tp-nav" id="tp-next">&#8250;</button>

  </div>

  <a class="tp-link-mobile" href="https://www.trustpilot.com/review/asuntosdigitales.com" target="_blank" rel="noopener">
    Ver todas las reseñas
  </a>

</div>

<script>
(function () {

  var CONFIG = {
    mode:         'live',
    liveUrl:      'https://mauricio-dev-ad.github.io/trustpilot-widget/reviews.json',
    maxCards:     9,
    score:        4.7,
    totalReviews: 366,
    reviews: [
      { stars: 5, title: "Fue una experiencia inspiradora", text: "Fue una experiencia inspiradora. No importa que sea en línea, todos los docentes logran transmitir conocimiento y motivar a lograr lo que uno desea. Su trato amable y apoyo incondicional es lo mejor.", author: "Alejandra Guerrero", date: "feb 2026", verified: false },
      { stars: 5, title: "Me encantó cada sesión", text: "Me encantó cada sesión. Hay profesores expertos en cada área correspondiente y se nota su larga carrera. La herramienta de IA es extraordinaria y de mucha ayuda. 100% recomendable.", author: "Daniela Uribe G.", date: "feb 2026", verified: true },
      { stars: 5, title: "Excelente experiencia, 100% recomendado", text: "He realizado dos diplomados con Asuntos Digitales y con mucha seguridad realizaré más. El contenido es altamente especializado y los ponentes son personas con experiencia e historial de éxito real.", author: "Miguel A.", date: "ene 2026", verified: true },
      { stars: 5, title: "Una experiencia inolvidable", text: "Los profesores son fantásticos, muy profesionales y con muchas ganas de enseñar. El material ha sido y seguirá siendo muy valioso en mi crecimiento personal. Les deseo mucho éxito siempre.", author: "Luis E Sandoval", date: "ene 2026", verified: true },
      { stars: 5, title: "Gran oportunidad para crecer", text: "Es una gran oportunidad en el ámbito personal y laboral. Proporcionan herramientas que te enseñan a crecer en tus negocios. Atención excepcional y son muy flexibles con el estudiante.", author: "Angel Arturo H.", date: "ene 2026", verified: false },
      { stars: 5, title: "Muy recomendable", text: "El programa y la dirección han sido muy esclarecedores. La estructura de las sesiones me pareció sumamente seria, profesional y respetuosa. El nivel de los profesores realmente muy bueno.", author: "Penny Agra", date: "ene 2026", verified: true },
      { stars: 5, title: "Buenas sesiones", text: "En general las clases estuvieron bastante bien explicadas y la información fue muy relevante. Las sesiones de networking y el contenido extra ayudaron mucho a entender el material.", author: "Christian Daniel", date: "dic 2025", verified: true },
      { stars: 5, title: "Formación de alto nivel", text: "La calidad de los ponentes y la profundidad del contenido superaron mis expectativas. Cada sesión aportó conocimientos aplicables de inmediato en mi trabajo diario.", author: "María González", date: "dic 2025", verified: true },
      { stars: 5, title: "Enriquecedora actualización de marketing", text: "La actualización de temas de marketing fue enriquecedora, así como las experiencias de los profesores. Un programa que realmente aporta valor.", author: "Ana Paola G", date: "jul 2024", verified: true }
    ]
  };

  var allReviews   = [];
  var visibleCount = 3;
  var position     = 0;   // posición en el track (incluye clones)
  var cloneCount   = 0;   // clones a cada lado
  var isAnimating  = false;

  // Estrella estilo Trustpilot: cuadro de color + estrella blanca centrada
  // mode: 'full' (verde) | 'half' (verde/gris) | 'empty' (gris)
  var TP_GREEN = '#00b67a';
  var TP_GREY  = '#dcdce6';
  var STAR_PTS = '12,2 15.09,8.26 22,9.27 17,14.14 18.18,21.02 12,17.77 5.82,21.02 7,14.14 2,9.27 8.91,8.26';

  function starSVG(cls, mode) {
    var bg;
    if (mode === 'full') {
      bg = '<rect width="24" height="24" fill="' + TP_GREEN + '"/>';
    } else if (mode === 'half') {
      bg = '<rect width="12" height="24" fill="' + TP_GREEN + '"/>'
         + '<rect x="12" width="12" height="24" fill="' + TP_GREY + '"/>';
    } else {
      bg = '<rect width="24" height="24" fill="' + TP_GREY + '"/>';
    }
    return '<svg class="' + cls + '" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">'
      + bg
      + '<polygon fill="#fff" points="' + STAR_PTS + '" '
      + 'transform="translate(12,12) scale(0.66) translate(-12,-12)"/>'
      + '</svg>';
  }

  function renderStars(score, cls) {
    var html = '';
    for (var i = 1; i <= 5; i++) {
      if (score >= i)            html += starSVG(cls, 'full');
      else if (score >= i - 0.5) html += starSVG(cls, 'half');
      else                       html += starSVG(cls, 'empty');
    }
    return html;
  }

  function formatCount(n) {
    if (n >= 1000) return (n/1000).toFixed(1).replace('.0','') + 'K';
    return '(' + n + ')';
  }

  function initials(name) {
    return (name||'?').split(' ').map(function(w){ return w[0]||''; }).slice(0,2).join('').toUpperCase();
  }

  function escHtml(s) {
    return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  var MESES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  function fmtDate(iso) {
    if (!iso) return '';
    var d = new Date(iso);
    if (isNaN(d.getTime())) return '';
    return d.getDate() + ' ' + MESES[d.getMonth()] + ' ' + d.getFullYear();
  }

  function getVisibleCount() {
    var vp = document.getElementById('tp-viewport');
    var w  = vp ? vp.offsetWidth : window.innerWidth;
    if (w < 480) return 1;
    if (w < 768) return 2;
    return 3;
  }

  function cardMetrics() {
    var vp    = document.getElementById('tp-viewport');
    var gap   = 16;
    var vpW   = vp ? vp.offsetWidth : 0;
    var cardW = Math.floor((vpW - gap * (visibleCount - 1)) / visibleCount);
    return { gap: gap, cardW: cardW };
  }

  function makeCard(r) {
    var card = document.createElement('div');
    card.className = 'tp-card';

    // Insignia verde de verificado sobre el avatar
    var badge = r.verified
      ? '<span class="tp-avatar-badge"><svg viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">'
        + '<circle cx="8" cy="8" r="7.5" fill="#00b67a"/>'
        + '<path d="M4.6 8.2l2.2 2.2 4.7-4.7" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>'
        + '</svg></span>'
      : '';

    // Meta: país · nº de reseñas del autor
    var meta = [];
    if (r.country)     meta.push(escHtml(r.country));
    if (r.reviewCount) meta.push(r.reviewCount + ' ' + (r.reviewCount === 1 ? 'reseña' : 'reseñas'));
    var metaHtml = meta.length ? '<div class="tp-author-meta">' + meta.join(' · ') + '</div>' : '';

    // Fecha arriba (publicación) y abajo (experiencia)
    var topDate = fmtDate(r.publishedISO) || escHtml(r.date || '');
    var expHtml = r.experienceISO
      ? '<div class="tp-card-foot"><span class="tp-card-exp">Fecha de la experiencia: <b>' + fmtDate(r.experienceISO) + '</b></span></div>'
      : '';

    card.innerHTML =
      '<div class="tp-card-head">'
        + '<div class="tp-avatar">' + escHtml(initials(r.author)) + badge + '</div>'
        + '<div class="tp-card-head-info">'
          + '<div class="tp-author-name">' + escHtml(r.author) + '</div>'
          + metaHtml
        + '</div>'
        + '<div class="tp-card-date-top">' + topDate + '</div>'
      + '</div>'
      + '<div class="tp-card-stars">' + renderStars(r.stars || 5, 'tp-card-star') + '</div>'
      + (r.title ? '<div class="tp-card-title">' + escHtml(r.title) + '</div>' : '')
      + '<p class="tp-card-text">' + escHtml(r.text) + '</p>'
      + expHtml;
    return card;
  }

  function applyWidths() {
    var track = document.getElementById('tp-track');
    var m = cardMetrics();
    var cards = track.children;
    for (var i = 0; i < cards.length; i++) {
      cards[i].style.width    = m.cardW + 'px';
      cards[i].style.minWidth = m.cardW + 'px';
    }
  }

  var TRANS = 'transform 0.45s cubic-bezier(0.25, 0.46, 0.45, 0.94)';

  function positionTrack(animate) {
    var track  = document.getElementById('tp-track');
    var m      = cardMetrics();
    var offset = position * (m.cardW + m.gap);
    track.style.transition = animate ? TRANS : 'none';
    track.style.transform  = 'translateX(-' + offset + 'px)';
    if (!animate) void track.offsetWidth;   // forzar reflow para snap instantáneo
  }

  // Construye el track con clones a cada lado para el bucle infinito
  function buildTrack() {
    var track = document.getElementById('tp-track');
    var n = allReviews.length;
    track.innerHTML = '';
    cloneCount = (n > visibleCount) ? visibleCount : 0;

    // Clones iniciales = últimas N reseñas (para ir hacia atrás sin salto)
    for (var i = n - cloneCount; i < n; i++) track.appendChild(makeCard(allReviews[i]));
    // Reseñas reales
    for (var j = 0; j < n; j++) track.appendChild(makeCard(allReviews[j]));
    // Clones finales = primeras N reseñas (para ir hacia adelante sin salto)
    for (var k = 0; k < cloneCount; k++) track.appendChild(makeCard(allReviews[k]));

    position = cloneCount;   // empezar en la primera reseña real
    applyWidths();
    positionTrack(false);
  }

  function go(dir) {
    if (cloneCount === 0 || isAnimating) return;
    isAnimating = true;
    position += dir;
    positionTrack(true);
    setTimeout(function() {
      var n = allReviews.length;
      if (position >= cloneCount + n) {
        position -= n;                  // pasó del último → saltar al real equivalente
        positionTrack(false);
      } else if (position < cloneCount) {
        position += n;                  // pasó del primero → saltar al real equivalente
        positionTrack(false);
      }
      isAnimating = false;
    }, 470);
  }

  function renderWidget(data) {
    var score  = (data.business && data.business.score)        ? data.business.score        : CONFIG.score;
    var total  = (data.business && data.business.totalReviews) ? data.business.totalReviews : CONFIG.totalReviews;
    allReviews = (data.reviews || []).slice(0, CONFIG.maxCards);

    document.getElementById('tp-score').textContent          = (+score).toFixed(1);
    document.getElementById('tp-header-stars').innerHTML     = renderStars(+score, 'tp-star-svg');
    document.getElementById('tp-count').textContent          = formatCount(total);

    // Swap skeleton → carrusel
    document.getElementById('tp-skeleton-state').classList.add('tp-hidden');
    document.getElementById('tp-loaded-state').classList.remove('tp-hidden');

    // Esperar un frame para que el DOM pinte antes de medir
    setTimeout(function() {
      visibleCount = getVisibleCount();
      buildTrack();
    }, 50);

    document.getElementById('tp-prev').addEventListener('click', function() { go(-1); });
    document.getElementById('tp-next').addEventListener('click', function() { go(1); });

    var resizeTimer;
    window.addEventListener('resize', function() {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(function() {
        visibleCount = getVisibleCount();
        buildTrack();
      }, 150);
    });
  }

  function renderStatic() {
    renderWidget({ business: { score: CONFIG.score, totalReviews: CONFIG.totalReviews }, reviews: CONFIG.reviews });
  }

  var liveUrl = (CONFIG.mode === 'live' && CONFIG.liveUrl && CONFIG.liveUrl.indexOf('TU-APP') === -1)
    ? CONFIG.liveUrl : null;

  if (liveUrl) {
    var url = liveUrl + '?_=' + Math.floor(Date.now() / 600000);
    fetch(url)
      .then(function(res) { if (!res.ok) throw new Error('HTTP ' + res.status); return res.json(); })
      .then(function(data) {
        if (data.reviews) {
          data.reviews = data.reviews.slice(0, CONFIG.maxCards);
        }
        renderWidget(data);
      })
      .catch(function() { renderStatic(); });
  } else {
    renderStatic();
  }

})();
</script>
